<!--
  The addon's icon, shown in Wealthfolio's add-ons list.

  A "212" wordmark rather than Trading 212's own logo: their mark is their
  trademark and their asset to distribute, and a copy drawn from memory would be
  a worse likeness than an honest reference. This says which broker the addon
  talks to without pretending to be published by them.

  Drawn as paths, not text, so it renders identically wherever it is shown — an
  <img> has no access to the app's fonts, and a missing one would silently
  reflow the mark.

  Three digits and nothing else. Earlier drafts added an underline and a rising
  chart line, which looked fine at 64px and turned to mush at the ~20px this is
  actually seen at. The digits are set on an even grid — 2s fifteen wide, the 1
  centred in the gap between them — because unequal spacing made it read "2 12".

  No width or height attributes: the viewBox alone lets it scale to whatever box
  it is given. The badge is filled rather than outlined so it reads on
  Wealthfolio's cream theme and its dark one alike.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trading 212">
  <rect width="64" height="64" rx="14" fill="#0B3A55"/>
  <g fill="#FFFFFF">
    <path d="M8 26.5a7.5 7.5 0 0 1 15 0c0 3.2-1.8 5.4-4 7.2L11.5 41H23v5H8v-4.6l9.6-7.6c1.4-1.1 2-2 2-3.3a3 3 0 0 0-6 0z"/>
    <path d="M27 24.5 33.2 18h4.3v28h-5.3V25.2l-2.6 2.2z"/>
    <path d="M41 26.5a7.5 7.5 0 0 1 15 0c0 3.2-1.8 5.4-4 7.2L44.5 41H56v5H41v-4.6l9.6-7.6c1.4-1.1 2-2 2-3.3a3 3 0 0 0-6 0z"/>
  </g>
</svg>
