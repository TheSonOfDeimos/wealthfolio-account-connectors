# Publish one release carrying every connector, when it lands on main.
#
# This used to cut a release per connector, keyed to that connector's manifest
# version — `trading212-v0.1.0`, `kraken-v0.1.0`. The tag named the thing you
# installed, which read well and hid the connectors from anyone looking for
# them: GitHub calls exactly one release "latest", the README points at
# `/releases/latest`, and that resolved to whichever connector shipped most
# recently. After Kraken 0.1.0 and Trading 212 0.2.0 went out minutes apart,
# `/releases/latest` offered the Trading 212 zip and nothing else, so the Kraken
# connector was published and unreachable by the route the README gives.
#
# So a release is now the repo, not a connector: one tag, every connector's zip
# on it. Each connector still carries its own version in its manifest, and that
# version is in its filename and in the notes — what changed is only where the
# artifacts land.
#
# Only the connector zips are uploaded. GitHub already attaches "Source code
# (zip)" and "(tar.gz)" to every release from the tag, so shipping a third
# archive of the same tree added a download nobody installing a connector
# wants, next to the two they do.
#
# Versioned from the root `package.json`. A release appears only when that
# version has not been tagged before, which keeps docs and refactor merges from
# republishing the same artifacts under a new tag. To ship, bump it.
name: Release

on:
  push:
    branches: [main]
  # Cut a release by hand — useful to re-run a publish that failed after the
  # tag was created.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish every connector
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build every package
        run: pnpm verify

      - name: Publish, if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(jq -r .version package.json)
          tag="v${version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released — nothing to do. Bump version in package.json to ship."
            exit 0
          fi

          # One zip per connector. Nothing else: GitHub's own source archives
          # already cover the tree at this tag.
          assets=()
          : > rows.md

          for manifest in connectors/*/manifest.json; do
            dir=$(dirname "$manifest")
            name=$(jq -r .name "$manifest")
            connector_version=$(jq -r .version "$manifest")

            echo "· Packaging $name $connector_version"
            ( cd "$dir" && pnpm package )

            zip=$(ls "$dir"/*.zip | head -1)
            [ -f "$zip" ] || { echo "No zip produced for $name" >&2; exit 1; }

            assets+=("$zip")
            printf '| %s | `%s` | `%s` |\n' \
              "$name" "$connector_version" "$(basename "$zip")" >> rows.md
          done

          [ "${#assets[@]}" -gt 0 ] || { echo "No connectors found" >&2; exit 1; }

          {
            printf 'Install a connector: **Wealthfolio → Settings → Add-ons → Add-on Manager → +**, then pick its zip below.\n\n'
            printf '| Connector | Version | Download |\n|---|---|---|\n'
            cat rows.md
            printf '\n'
            printf 'Each connector asks for its own API credentials in its setup form and keeps them in Wealthfolio'"'"'s keyring. Trading 212 sends a bearer token the host attaches itself; Kraken signs each request, so it reads its private key back to do so — give it a read-only key.\n\n'
            printf 'What each connector imports, and what it deliberately does not, is in its own README:\n'
            for manifest in connectors/*/manifest.json; do
              dir=$(dirname "$manifest")
              printf -- '- [%s](https://github.com/%s/blob/main/%s/README.md)\n' \
                "$(jq -r .name "$manifest")" "${GITHUB_REPOSITORY}" "$dir"
            done
            printf '\nThe source at this tag is under **Source code** below.\n\n'
            printf 'Licensed under the GNU AGPL v3.\n'
          } > notes.md

          gh release create "$tag" "${assets[@]}" \
            --title "Wealthfolio account connectors ${version}" \
            --notes-file notes.md
